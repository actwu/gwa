    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWA Flow Blue - Expanded</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #000000;
            --surface: #1a1c1e;
            --primary: #a8c7fa; 
            --on-primary: #062e6f;
            --error: #f2b8b5;
            --text: #e2e2e6;
            --text-dim: #8e9199;
            --input-bg: #282a2d;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--surface);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .term-group {
            border-left: 3px solid var(--primary);
            padding-left: 12px;
            margin-bottom: 10px;
        }

        .term-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .term-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .term-gpa {
            font-size: 0.75rem;
            background: rgba(168, 199, 250, 0.15);
            padding: 4px 10px;
            border-radius: 100px;
            color: var(--primary);
            font-weight: 700;
        }

        .list-area {
            /* Height now adjusts based on content */
            height: auto; 
            margin-bottom: 10px;
        }

        .row {
            display: grid;
            /* Added column for the counter */
            grid-template-columns: 30px 1fr 1fr 40px; 
            gap: 10px;
            margin-bottom: 12px;
            background: var(--input-bg);
            padding: 12px;
            border-radius: 16px;
            align-items: center;
        }

        .item-num {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-dim);
        }

        .field {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .field label {
            font-size: 0.6rem;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        input {
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            outline: none;
            padding: 2px 0;
            border-bottom: 1px solid var(--text-dim);
            width: 100%;
        }

        input:focus { border-bottom: 2px solid var(--primary); }

        .btn {
            border: none;
            border-radius: 100px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .btn-add {
            padding: 8px 16px;
            font-size: 0.75rem;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            font-weight: 600;
        }

        .btn-delete {
            background: transparent;
            color: var(--error);
            width: 40px;
            height: 40px;
        }

        .result-card {
            background: var(--primary);
            color: var(--on-primary);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            position: sticky;
            bottom: 12px; /* Floats above bottom padding */
        }

        .result-val { font-size: 2.2rem; font-weight: 900; }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fa-solid fa-square-poll-vertical"></i> GWA Flow</h1>

        <div id="groups-wrapper">
            <section class="term-group" id="group-prelim">
                <div class="term-header">
                    <span class="term-title">Prelims</span>
                    <span class="term-gpa">GPA: <span id="gpa-prelim">0.00</span></span>
                </div>
                <div class="list-area" id="list-prelim"></div>
                <button class="btn btn-add" onmousedown="addRow('list-prelim')"><i class="fa-solid fa-plus"></i> Add Subject</button>
            </section>

            <section class="term-group" id="group-midterm">
                <div class="term-header">
                    <span class="term-title">Midterms</span>
                    <span class="term-gpa">GPA: <span id="gpa-midterm">0.00</span></span>
                </div>
                <div class="list-area" id="list-midterm"></div>
                <button class="btn btn-add" onmousedown="addRow('list-midterm')"><i class="fa-solid fa-plus"></i> Add Subject</button>
            </section>

            <section class="term-group" id="group-finals">
                <div class="term-header">
                    <span class="term-title">Finals</span>
                    <span class="term-gpa">GPA: <span id="gpa-finals">0.00</span></span>
                </div>
                <div class="list-area" id="list-finals"></div>
                <button class="btn btn-add" onmousedown="addRow('list-finals')"><i class="fa-solid fa-plus"></i> Add Subject</button>
            </section>
        </div>

        <div class="result-card">
            <span style="font-weight: 800; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Overall GWA</span>
            <span class="result-val" id="display-overall">0.00</span>
        </div>
    </div>

    <script>
        window.onload = () => {
            addRow('list-prelim');
            addRow('list-midterm');
            addRow('list-finals');
        };

        function updateCounters(listId) {
            const list = document.getElementById(listId);
            const counters = list.querySelectorAll('.item-num');
            counters.forEach((span, index) => {
                span.innerText = `#${index + 1}`;
            });
        }

        function addRow(containerId) {
            const list = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'row';
            div.innerHTML = `
                <span class="item-num">#0</span>
                <div class="field">
                    <label>Grade</label>
                    <input type="number" step="0.01" class="grade" placeholder="1.0" oninput="calc()">
                </div>
                <div class="field">
                    <label>Units</label>
                    <input type="number" step="1" class="unit" placeholder="3" oninput="calc()">
                </div>
                <button class="btn btn-delete" onmousedown="removeRow(this, '${containerId}')">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;
            list.appendChild(div);
            updateCounters(containerId);
        }

        function removeRow(btn, containerId) {
            const row = btn.closest('.row');
            const list = document.getElementById(containerId);
            if (list.children.length > 1) {
                row.remove();
                updateCounters(containerId);
                calc();
            }
        }

        function calculateTermGPA(listId, displayId) {
            const list = document.getElementById(listId);
            const grades = list.querySelectorAll('.grade');
            const units = list.querySelectorAll('.unit');
            let wp = 0, u = 0;

            grades.forEach((g, i) => {
                const gv = parseFloat(g.value);
                const uv = parseFloat(units[i].value);
                if (!isNaN(gv) && !isNaN(uv)) {
                    wp += (gv * uv);
                    u += uv;
                }
            });
            
            const gpa = u > 0 ? (wp / u).toFixed(2) : "0.00";
            document.getElementById(displayId).innerText = gpa;
            return { wp, u };
        }

        function calc() {
            const prelim = calculateTermGPA('list-prelim', 'gpa-prelim');
            const midterm = calculateTermGPA('list-midterm', 'gpa-midterm');
            const finals = calculateTermGPA('list-finals', 'gpa-finals');

            const totalWP = prelim.wp + midterm.wp + finals.wp;
            const totalU = prelim.u + midterm.u + finals.u;

            const overall = totalU > 0 ? (totalWP / totalU).toFixed(2) : "0.00";
            document.getElementById('display-overall').innerText = overall;
        }
    </script>
</body>
</html>
